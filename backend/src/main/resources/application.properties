# =======================================================
# Fitness Tracker Backend - Application Properties
# =======================================================

# Server Port
server.port=8080

# Context Path: frontend calls http://localhost:8080/api/...
# We map controller routes to /api

# MySQL Database Configuration
# Using localhost:3306 and database name fitness_tracker
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitness_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update' automatically creates and updates tables without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (JSON Web Token) Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=604800000

# CORS Allowed Origins (Vite React runs on port 5173, Create React App on 3000)
cors.allowed.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
