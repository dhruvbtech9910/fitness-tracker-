# =======================================================
# Fitness Tracker Backend - Development Profile (H2 In-Memory)
# Use this profile when MySQL is not currently running:
# mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =======================================================

server.port=8080

spring.datasource.url=jdbc:h2:mem:fitness_tracker;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=604800000

cors.allowed.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
